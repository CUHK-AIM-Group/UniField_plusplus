[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unifield-plusplus"
version = "0.1.0"
description = "Plan-guided MRI enhancement with registered anatomical priors"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools.packages.find]
include = ["diffsynth*", "unifield*"]

[tool.setuptools.package-data]
diffsynth = ["tokenizer_configs/**/*"]
